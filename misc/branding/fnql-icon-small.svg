<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 320 320">
  <!-- FnQL application icon, simplified for sizes of 48px and below: the ring
       loses its plates and ticks, and the disc and "fn" grow to stay legible. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="-150" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#d3d6db"/>
      <stop offset="1" stop-color="#eceef1"/>
    </linearGradient>
    <radialGradient id="disc" cx="0" cy="-40" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c2181e"/>
      <stop offset=".6" stop-color="#8a0c12"/>
      <stop offset="1" stop-color="#3a0306"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="-124" x2="0" y2="-10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="discClip"><circle r="122"/></clipPath>
  </defs>

  <g transform="translate(160 160)">
    <circle r="159" fill="#08080a"/>
    <circle r="141" fill="none" stroke="url(#steel)" stroke-width="20"/>
    <circle r="122" fill="url(#disc)"/>
    <g clip-path="url(#discClip)">
      <ellipse cx="0" cy="-82" rx="122" ry="72" fill="url(#gloss)" opacity=".45"/>
    </g>
    <g transform="translate(8 0) scale(1.3) skewX(-12) translate(-73.5 -52)" fill="none" stroke-linejoin="round">
      <g stroke="#1c0102" stroke-width="36">
        <path d="M24 100 V36 Q24 14 46 14 H62"/>
        <path d="M2 48 H56"/>
        <path d="M91 100 V25"/>
        <path d="M91 60 Q91 36 115 36 H121 Q145 36 145 60 V100"/>
      </g>
      <g stroke="#ffffff" stroke-width="27">
        <path d="M24 100 V36 Q24 14 46 14 H62"/>
        <path d="M2 48 H56"/>
        <path d="M91 100 V25"/>
        <path d="M91 60 Q91 36 115 36 H121 Q145 36 145 60 V100"/>
      </g>
    </g>
  </g>
</svg>

# Cross build for Linux aarch64 from an x86_64 Linux host (Debian/Ubuntu
# crossbuild packages: gcc-aarch64-linux-gnu, g++-aarch64-linux-gnu).
# Tests run through qemu-user (package qemu-user); a native aarch64 host
# can drop the cross file entirely.
[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-gcc-ar'
strip = 'aarch64-linux-gnu-strip'
exe_wrapper = ['qemu-aarch64', '-L', '/usr/aarch64-linux-gnu']

[host_machine]
system = 'linux'
subsystem = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

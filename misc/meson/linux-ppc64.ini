# Cross build for Linux ppc64 from an x86_64 Linux host (Debian/Ubuntu
# crossbuild packages: gcc-powerpc64-linux-gnu, g++-powerpc64-linux-gnu).
# Tests run through qemu-user (package qemu-user); a native ppc64 host
# can drop the cross file entirely.
[binaries]
c = 'powerpc64-linux-gnu-gcc'
cpp = 'powerpc64-linux-gnu-g++'
ar = 'powerpc64-linux-gnu-gcc-ar'
strip = 'powerpc64-linux-gnu-strip'
exe_wrapper = ['qemu-ppc64', '-L', '/usr/powerpc64-linux-gnu']

[host_machine]
system = 'linux'
subsystem = 'linux'
cpu_family = 'ppc64'
cpu = 'ppc64'
endian = 'big'

# Cross build for Linux ppc64le from an x86_64 Linux host (Debian/Ubuntu
# crossbuild packages: gcc-powerpc64le-linux-gnu, g++-powerpc64le-linux-gnu).
# Tests run through qemu-user (package qemu-user); a native ppc64le host
# can drop the cross file entirely.
[binaries]
c = 'powerpc64le-linux-gnu-gcc'
cpp = 'powerpc64le-linux-gnu-g++'
ar = 'powerpc64le-linux-gnu-gcc-ar'
strip = 'powerpc64le-linux-gnu-strip'
exe_wrapper = ['qemu-ppc64le', '-L', '/usr/powerpc64le-linux-gnu']

[host_machine]
system = 'linux'
subsystem = 'linux'
cpu_family = 'ppc64le'
cpu = 'ppc64le'
endian = 'little'

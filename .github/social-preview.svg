<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- FnQL GitHub social preview. Render to PNG at 1280x640. -->
  <defs>
    <!-- Carbon fibre: 2/2 twill weave, 6px tows on a 24px repeat -->
    <linearGradient id="warp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0c0e"/>
      <stop offset=".5" stop-color="#3b3e44"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="weft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060708"/>
      <stop offset=".5" stop-color="#1d1f23"/>
      <stop offset="1" stop-color="#060708"/>
    </linearGradient>
    <pattern id="carbon" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="translate(4 2)">
      <rect width="24" height="24" fill="#050506"/>
      <g fill="url(#weft)">
        <rect x="12" y="0" width="12" height="6"/>
        <rect x="6" y="6" width="12" height="6"/>
        <rect x="0" y="12" width="12" height="6"/>
        <rect x="18" y="18" width="12" height="6"/>
        <rect x="-6" y="18" width="12" height="6"/>
      </g>
      <g fill="url(#warp)">
        <rect x="0" y="0" width="6" height="12"/>
        <rect x="6" y="18" width="6" height="12"/>
        <rect x="6" y="-6" width="6" height="12"/>
        <rect x="12" y="12" width="6" height="12"/>
        <rect x="18" y="6" width="6" height="12"/>
      </g>
    </pattern>

    <radialGradient id="spot" cx="640" cy="262" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".45" stop-color="#000" stop-opacity=".28"/>
      <stop offset="1" stop-color="#000" stop-opacity=".9"/>
    </radialGradient>
    <radialGradient id="redglow" cx="560" cy="262" r="520" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 92) scale(1 .65)">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#d0141b" stop-opacity=".13"/>
      <stop offset="1" stop-color="#d0141b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".075"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Accent slashes -->
    <linearGradient id="slash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#8a0a10"/>
    </linearGradient>
    <linearGradient id="slashR" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#8a0a10"/>
    </linearGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-70)">
      <rect width="14" height="14" fill="none"/>
      <rect width="5" height="14" fill="#ff3b30"/>
    </pattern>

    <!-- Logo materials -->
    <linearGradient id="steel" x1="0" y1="-150" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#c9cdd3"/>
      <stop offset=".55" stop-color="#8d9299"/>
      <stop offset="1" stop-color="#e9ebee"/>
    </linearGradient>
    <linearGradient id="gunmetal" x1="-150" y1="-150" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a4e55"/>
      <stop offset=".5" stop-color="#17181b"/>
      <stop offset="1" stop-color="#3a3d43"/>
    </linearGradient>
    <radialGradient id="casing" cx="0" cy="-40" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26282c"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="disc" cx="0" cy="-34" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b3161b"/>
      <stop offset=".55" stop-color="#7a0b10"/>
      <stop offset="1" stop-color="#2c0204"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="-104" x2="0" y2="-4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="discClip"><circle r="104"/></clipPath>

    <linearGradient id="panel" x1="0" y1="-75" x2="0" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#f1f2f4"/>
      <stop offset="1" stop-color="#b9bdc4"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4136"/>
      <stop offset=".45" stop-color="#d0141b"/>
      <stop offset="1" stop-color="#6d050a"/>
    </linearGradient>
    <linearGradient id="fnInk" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#eef0f3"/>
      <stop offset="1" stop-color="#aab0b8"/>
    </linearGradient>

    <!-- Lettering, drawn as centre-line strokes so outline and fill share one shape -->
    <rect id="glyphQ" fill="none" x="14" y="14" width="78" height="72" rx="19"/>
    <path id="glyphQtail" fill="none" d="M57 55 L101 99"/>
    <path id="glyphL" fill="none" d="M14 0 V86 H86" stroke-linejoin="miter"/>
    <g id="glyphFn" fill="none" stroke-linejoin="round">
      <path d="M24 100 V36 Q24 14 46 14 H62"/>
      <path d="M2 48 H56"/>
      <path d="M91 100 V25"/>
      <path d="M91 60 Q91 36 115 36 H121 Q145 36 145 60 V100"/>
    </g>

    <filter id="lockupShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope=".85"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="textShadow" x="-10%" y="-40%" width="120%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".9"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="1280" height="640" fill="#050506"/>
  <rect width="1280" height="640" fill="url(#carbon)"/>
  <!-- clear-coat sheen bands -->
  <g transform="skewX(-24)">
    <rect x="560" y="0" width="330" height="640" fill="url(#sheen)"/>
    <rect x="1010" y="0" width="120" height="640" fill="url(#sheen)" opacity=".7"/>
  </g>
  <rect width="1280" height="640" fill="url(#redglow)"/>
  <rect width="1280" height="640" fill="url(#spot)"/>

  <!-- esports slashes: top-left and bottom-right, same lean as the logo -->
  <g>
    <polygon points="0,0 96,0 0,264" fill="url(#slash)"/>
    <polygon points="112,0 132,0 0,363 0,308" fill="url(#slash)" opacity=".9"/>
    <polygon points="150,0 240,0 0,660 0,412" fill="url(#hatch)" opacity=".16"/>
    <polygon points="1280,640 1184,640 1280,376" fill="url(#slashR)"/>
    <polygon points="1168,640 1148,640 1280,277 1280,332" fill="url(#slashR)" opacity=".9"/>
    <polygon points="1130,640 1040,640 1280,-20 1280,228" fill="url(#hatch)" opacity=".16"/>
  </g>

  <!-- frame ticks -->
  <g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2">
    <path d="M1206 34 H1246 V74"/>
    <path d="M74 606 H34 V566"/>
  </g>

  <!-- ===== Logo lockup ===== -->
  <g filter="url(#lockupShadow)">
    <!-- banner plate, leaning with the lettering -->
    <g transform="translate(495 274) skewX(-12)">
      <rect x="0" y="-75" width="442" height="150" rx="30" fill="none" stroke="#08080a" stroke-width="28"/>
      <rect x="0" y="-75" width="442" height="150" rx="30" fill="none" stroke="#f6f7f9" stroke-width="17"/>
      <rect x="0" y="-75" width="442" height="150" rx="30" fill="url(#panel)" stroke="#08080a" stroke-width="9"/>
      <g transform="translate(192 -50)">
        <g stroke="#0a0606" stroke-width="40">
          <use href="#glyphQ"/>
          <use href="#glyphQtail" stroke-width="32"/>
          <use href="#glyphL" x="120"/>
        </g>
        <g stroke="url(#ink)" stroke-width="29">
          <use href="#glyphQ"/>
          <use href="#glyphQtail" stroke-width="21"/>
          <use href="#glyphL" x="120"/>
        </g>
      </g>
    </g>

    <!-- emblem -->
    <g transform="translate(495 262)">
      <circle r="156" cx="7" cy="8" fill="#000" opacity=".55" filter="url(#soft)"/>
      <circle r="153" fill="#08080a"/>
      <circle r="147" fill="url(#casing)" stroke="url(#steel)" stroke-width="4"/>
      <!-- armour plates: bright upper-left and lower-right, gunmetal between -->
      <circle r="132" fill="none" stroke="url(#gunmetal)" stroke-width="20"/>
      <circle r="132" fill="none" stroke="url(#steel)" stroke-width="20"
              stroke-dasharray="207.3 207.4" transform="rotate(180)"/>
      <circle r="132" fill="none" stroke="#08080a" stroke-width="22"
              stroke-dasharray="5 98.67" transform="rotate(-1.1)"/>
      <circle r="119" fill="#060607"/>
      <circle r="113" fill="none" stroke="#3d4046" stroke-width="5" stroke-dasharray="3 16.72"/>
      <circle r="108" fill="#050506" stroke="url(#steel)" stroke-width="3"/>
      <circle r="104" fill="url(#disc)"/>
      <g clip-path="url(#discClip)">
        <ellipse cx="0" cy="-70" rx="104" ry="62" fill="url(#gloss)" opacity=".5"/>
      </g>
      <circle r="104" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="5"/>
      <!-- fn -->
      <g transform="translate(6 0) skewX(-12) translate(-73.5 -52)">
        <g stroke="#1c0102" stroke-width="32"><use href="#glyphFn"/></g>
        <g stroke="url(#fnInk)" stroke-width="24"><use href="#glyphFn"/></g>
      </g>
    </g>
  </g>

  <!-- ===== Subtext ===== -->
  <g text-anchor="middle" filter="url(#textShadow)">
    <text x="640" y="497" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="500"
          letter-spacing="6.5" fill="#c3c8cf">OPEN-SOURCE PROJECT FOR A MODERN AND ENHANCED</text>
    <g transform="translate(640 552) skewX(-12)">
      <text font-family="Montserrat, Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="800"
            letter-spacing="5"><tspan fill="#ff3229">QUAKE LIVE</tspan><tspan fill="#ffffff"> EXPERIENCE</tspan></text>
    </g>
  </g>
  <!-- slash marks flanking the first line -->
  <g fill="#ff3229">
    <polygon points="141,497 147,497 153,479 147,479"/>
    <polygon points="153,497 159,497 165,479 159,479"/>
    <polygon points="1115,497 1121,497 1127,479 1121,479"/>
    <polygon points="1127,497 1133,497 1139,479 1133,479"/>
  </g>
</svg>

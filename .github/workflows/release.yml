name: release

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FNQL_LINUX_GLIBC_MAX: "2.31"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows_glx_runner_labels:
        description: JSON labels for the Windows self-hosted GLx proof runner.
        required: true
        default: '["self-hosted","windows","glx"]'
        type: string
      linux_glx_runner_labels:
        description: JSON labels for the Linux self-hosted GLx proof runner.
        required: true
        default: '["self-hosted","linux","glx"]'
        type: string
      windows_glx_runtime_basepath:
        description: Retail Quake Live basepath on the Windows proof runner.
        required: false
        default: ''
        type: string
      linux_glx_runtime_basepath:
        description: Retail Quake Live basepath on the Linux proof runner.
        required: false
        default: ''
        type: string
      windows_glx_proof_dir:
        description: Reviewed GLx baseline/proof directory on the Windows runner.
        required: false
        default: ''
        type: string
      linux_glx_proof_dir:
        description: Reviewed GLx baseline/proof directory on the Linux runner.
        required: false
        default: ''
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.meta.outputs.build_number }}
      build_date: ${{ steps.meta.outputs.build_date }}
      base_version: ${{ steps.meta.outputs.base_version }}
      version_string: ${{ steps.meta.outputs.version_string }}
      head_commit: ${{ steps.meta.outputs.head_commit }}
      head_commit_short: ${{ steps.meta.outputs.head_commit_short }}
      previous_release_commit: ${{ steps.meta.outputs.previous_release_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Resolve release metadata
        id: meta
        run: |
          python scripts/manual_release.py github-output --build-date "$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Summarize
        run: |
          echo "Release build metadata resolved"
          echo "Base version: ${{ steps.meta.outputs.base_version }}"
          echo "Build version: ${{ steps.meta.outputs.version_string }}"
          echo "Head commit: ${{ steps.meta.outputs.head_commit }}"
          echo "Previous release commit: ${{ steps.meta.outputs.previous_release_commit }}"

  windows-msys32:
    needs: [prepare]
    name: Build Windows-MSYS2 x86
    runs-on: windows-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: git
          pacboy: >-
            toolchain:p
            meson:p
            ninja:p

      - name: Stamp release build version
        shell: msys2 {0}
        run: |
          python scripts/manual_release.py stamp-version --build-number ${{ needs.prepare.outputs.build_number }}
          python scripts/generate_docs.py

      - name: Build
        shell: msys2 {0}
        run: |
          mkdir -p bin
          meson setup meson/build-x86 \
            --buildtype=release \
            --wrap-mode=forcefallback \
            --prefix "$PWD/bin" \
            -Dc_link_args=-static \
            -Dcpp_link_args=-static \
            -Dcurl=enabled \
            -Dcurl-dlopen=false \
            -Dsdl=disabled \
            -Drenderer-dlopen=true \
            -Drenderers=glx,vk,rtx \
            -Drenderer-default=glx \
            -Daudio-tests=true \
            -Dglx-tests=true \
            -Dzlib:default_library=static \
            -Dlibjpeg-turbo:simd=disabled
          meson compile -C meson/build-x86
          meson install -C meson/build-x86 --no-rebuild --skip-subprojects

      - name: Run complete regression suite
        shell: msys2 {0}
        run: meson test -C meson/build-x86 --print-errorlogs

      - name: Stage pinned Steam provider
        shell: msys2 {0}
        run: python scripts/fetch_steam_provider.py --output bin/fnql_steam.dll

      - name: Check Windows runtime dependencies
        shell: msys2 {0}
        run: python scripts/check_windows_runtime_deps.py --require-pe bin

      - name: Verify release layout
        shell: msys2 {0}
        run: python scripts/verify_release_layout.py bin/FnQL-pkg.fnz

      - uses: actions/upload-artifact@v7
        with:
          name: windows-mingw-x86
          path: bin
          if-no-files-found: error
          retention-days: 5

  windows-msvc:
    needs: [prepare]
    name: Build Windows-MSVC x86
    runs-on: windows-2022
    steps:
      - uses: microsoft/setup-msbuild@v3

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Stamp release build version
        run: |
          python scripts/manual_release.py stamp-version --build-number ${{ needs.prepare.outputs.build_number }}
          python scripts/generate_docs.py

      - name: Install Meson
        run: python -m pip install meson ninja

      - name: Build
        shell: cmd
        run: |
          if not exist bin mkdir bin

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64 || exit /b
          meson setup meson\build-x86 --buildtype=release --wrap-mode=forcefallback --prefix "%CD%\bin" -Db_vscrt=static_from_buildtype -Dzlib:default_library=static -Dcurl=enabled -Dcurl-dlopen=false -Dsdl=disabled -Drenderer-dlopen=true -Drenderers=glx,vk,rtx -Drenderer-default=glx -Daudio-tests=true -Dglx-tests=true -Dlibjpeg-turbo:simd=disabled || exit /b
          meson compile -C meson\build-x86 || exit /b
          meson install -C meson\build-x86 --no-rebuild --skip-subprojects || exit /b

      - name: Run complete regression suite
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64 || exit /b
          meson test -C meson\build-x86 --print-errorlogs || exit /b

      - name: Stage pinned Steam provider
        run: python scripts/fetch_steam_provider.py --output bin/fnql_steam.dll

      - name: Check Windows runtime dependencies
        run: python scripts/check_windows_runtime_deps.py --require-pe bin

      - name: Verify release layout
        run: python scripts/verify_release_layout.py bin/FnQL-pkg.fnz

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-x86
          path: bin
          if-no-files-found: error
          retention-days: 5

  source-validation:
    needs: [prepare]
    name: Release source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install source regression runner
        run: python -m pip install pytest==8.4.1

      - name: Run complete source regression suite
        run: python -m pytest

  linux-x86-regression:
    needs: [prepare]
    name: Run Linux i686 Meson regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install i686 Meson build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -qq update
          sudo apt-get install -y \
            file \
            gcc-multilib \
            g++-multilib \
            glslang-tools \
            libasound2-dev:i386 \
            libc6-dev-i386 \
            libgl-dev:i386 \
            libx11-dev:i386 \
            libxext-dev:i386 \
            libxrandr-dev:i386 \
            libxxf86dga-dev:i386 \
            libxxf86vm-dev:i386 \
            linux-libc-dev:i386 \
            mesa-common-dev:i386 \
            meson \
            ninja-build \
            pkg-config \
            python3

      - name: Build Linux i686 regression targets
        run: |
          meson setup .tmp/meson-linux-release-tests \
            --cross-file misc/meson/linux-x86.ini \
            --buildtype=release \
            -Daudio-tests=true \
            -Dbuild-client=true \
            -Dbuild-server=false \
            -Dcurl=disabled \
            -Dglx-tests=true \
            -Dogg-vorbis=false \
            -Drenderer-dlopen=true \
            -Drenderer-default=glx \
            -Drenderers=glx,vk,rtx \
            -Dsdl=disabled
          meson compile -C .tmp/meson-linux-release-tests

      - name: Run complete Linux i686 regression suite
        run: meson test -C .tmp/meson-linux-release-tests --print-errorlogs

  ubuntu-x86:
    needs: [prepare]
    name: Build Ubuntu x86
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install tools
        run: |
          dpkg --add-architecture i386
          apt-get -qq update
          apt-get -y install git make python3 python3-pip binutils gcc-multilib g++-multilib libcurl4-openssl-dev:i386 libjpeg-dev:i386 libogg-dev:i386 libvorbis-dev:i386 mesa-common-dev:i386 libxxf86dga-dev:i386 libxrandr-dev:i386 libxxf86vm-dev:i386 libasound2-dev:i386 libopenal-dev:i386
          python3 -m pip install meson==1.9.1

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch pinned FontStash source
        run: meson subprojects download fontstash

      - name: Stamp release build version
        run: python3 scripts/manual_release.py stamp-version --build-number "${{ needs.prepare.outputs.build_number }}"

      - name: Build
        run: |
          make install -j$(nproc) ARCH=x86 COMPILE_ARCH=x86 CC=gcc DESTDIR=bin USE_SDL=0 USE_RENDERER_DLOPEN=1 USE_GLX=1 USE_VK=1 USE_RTX=1

      - name: Check glibc baseline
        run: python3 scripts/check_elf_glibc.py --max-glibc "$FNQL_LINUX_GLIBC_MAX" --require-elf bin

      - name: Verify release layout
        run: python3 scripts/verify_release_layout.py bin/FnQL-pkg.fnz

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86
          path: bin
          if-no-files-found: error
          retention-days: 5

  push-build-validation:
    if: always()
    needs: [prepare, windows-msys32, windows-msvc, source-validation, linux-x86-regression, ubuntu-x86]
    runs-on: ubuntu-latest
    steps:
      - name: Check platform build results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: data["result"]
              for name, data in needs.items()
              if data["result"] != "success"
          }

          if failed:
              for name, result in failed.items():
                  print(f"{name}: {result}")
              sys.exit(1)

          print("All platform build validations passed.")
          PY

  glx-release-proof:
    if: github.event_name == 'workflow_dispatch' && needs.push-build-validation.result == 'success'
    needs: [prepare, windows-msys32, windows-msvc, ubuntu-x86, push-build-validation]
    name: Prove ${{ matrix.proof_variant }}
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - proof_variant: windows-mingw-x86
            proof_platform: windows-x86
            artifact_name: windows-mingw-x86
            client_name: fnql.exe
            glx_module_name: fnql_glx_x86.dll
            runner_labels: ${{ inputs.windows_glx_runner_labels || vars.FNQL_GLX_WINDOWS_RUNNER_LABELS || '["self-hosted","windows","glx"]' }}
            runtime_basepath: ${{ inputs.windows_glx_runtime_basepath || vars.FNQL_GLX_WINDOWS_RUNTIME_BASEPATH || vars.FNQL_GLX_RUNTIME_BASEPATH }}
            proof_dir: ${{ inputs.windows_glx_proof_dir || vars.FNQL_GLX_WINDOWS_PROOF_DIR || vars.FNQL_GLX_PROOF_DIR }}
          - proof_variant: windows-msvc-x86
            proof_platform: windows-x86
            artifact_name: windows-msvc-x86
            client_name: fnql.exe
            glx_module_name: fnql_glx_x86.dll
            runner_labels: ${{ inputs.windows_glx_runner_labels || vars.FNQL_GLX_WINDOWS_RUNNER_LABELS || '["self-hosted","windows","glx"]' }}
            runtime_basepath: ${{ inputs.windows_glx_runtime_basepath || vars.FNQL_GLX_WINDOWS_RUNTIME_BASEPATH || vars.FNQL_GLX_RUNTIME_BASEPATH }}
            proof_dir: ${{ inputs.windows_glx_proof_dir || vars.FNQL_GLX_WINDOWS_PROOF_DIR || vars.FNQL_GLX_PROOF_DIR }}
          - proof_variant: linux-x86
            proof_platform: linux-x86
            artifact_name: linux-x86
            client_name: fnql
            glx_module_name: fnql_glx_x86.so
            runner_labels: ${{ inputs.linux_glx_runner_labels || vars.FNQL_GLX_LINUX_RUNNER_LABELS || '["self-hosted","linux","glx"]' }}
            runtime_basepath: ${{ inputs.linux_glx_runtime_basepath || vars.FNQL_GLX_LINUX_RUNTIME_BASEPATH || vars.FNQL_GLX_RUNTIME_BASEPATH }}
            proof_dir: ${{ inputs.linux_glx_proof_dir || vars.FNQL_GLX_LINUX_PROOF_DIR || vars.FNQL_GLX_PROOF_DIR }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare clean proof workspace
        shell: python
        env:
          FNQL_GLX_PROOF_VARIANT: ${{ matrix.proof_variant }}
          FNQL_GLX_BUILD_RUN_ID: ${{ github.run_id }}
          FNQL_GLX_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          import os
          import shutil
          from pathlib import Path

          variant = os.environ["FNQL_GLX_PROOF_VARIANT"]
          stale_roots = (
              Path(".tmp") / "glx-runtime-artifact" / variant,
              Path(".tmp")
              / "glx-release-proof"
              / variant
              / f"{os.environ['FNQL_GLX_BUILD_RUN_ID']}-{os.environ['FNQL_GLX_BUILD_RUN_ATTEMPT']}",
          )
          for stale_root in stale_roots:
              if stale_root.exists():
                  shutil.rmtree(stale_root)

      - name: Download exact release runtime
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: .tmp/glx-runtime-artifact/${{ matrix.proof_variant }}

      - name: Run complete same-artifact GLx proof
        shell: python
        env:
          FNQL_GLX_PROOF_VARIANT: ${{ matrix.proof_variant }}
          FNQL_GLX_PROOF_PLATFORM: ${{ matrix.proof_platform }}
          FNQL_GLX_CLIENT_NAME: ${{ matrix.client_name }}
          FNQL_GLX_MODULE_NAME: ${{ matrix.glx_module_name }}
          FNQL_GLX_RUNTIME_BASEPATH: ${{ matrix.runtime_basepath }}
          FNQL_GLX_PROOF_DIR: ${{ matrix.proof_dir }}
          FNQL_GLX_SOURCE_COMMIT: ${{ needs.prepare.outputs.head_commit }}
          FNQL_GLX_BUILD_RUN_ID: ${{ github.run_id }}
          FNQL_GLX_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          FNQL_GLX_SCREENSHOT_MAX_RMS: '2.0'
          FNQL_GLX_SCREENSHOT_MAX_PIXEL_RATIO: '0.005'
          FNQL_GLX_PERFORMANCE_MAX_GROWTH_RATIO: '0.20'
        run: |
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          variant = os.environ["FNQL_GLX_PROOF_VARIANT"]
          artifact_root = Path(".tmp") / "glx-runtime-artifact" / variant
          client = (artifact_root / os.environ["FNQL_GLX_CLIENT_NAME"]).resolve()
          glx_module = (artifact_root / os.environ["FNQL_GLX_MODULE_NAME"]).resolve()
          basepath = os.environ.get("FNQL_GLX_RUNTIME_BASEPATH", "").strip()
          proof_dir = os.environ.get("FNQL_GLX_PROOF_DIR", "").strip()
          missing = []
          if not client.is_file():
              missing.append(f"client {client}")
          if not glx_module.is_file():
              missing.append(f"GLx module {glx_module}")
          if not basepath:
              missing.append("runtime basepath")
          if not proof_dir:
              missing.append("reviewed proof directory")
          if missing:
              raise SystemExit("Missing GLx release-proof input: " + ", ".join(missing))
          if os.name != "nt":
              client.chmod(client.stat().st_mode | 0o100)

          output_root = (
              Path(".tmp")
              / "glx-release-proof"
              / variant
              / f"{os.environ['FNQL_GLX_BUILD_RUN_ID']}-{os.environ['FNQL_GLX_BUILD_RUN_ATTEMPT']}"
          )
          if output_root.exists():
              shutil.rmtree(output_root)

          for gate in ("rc-smoke", "rc-parity", "rc-proof"):
              gate_output = output_root / gate
              summary_path = gate_output / f"{gate}.md"
              command = [
                  sys.executable,
                  "scripts/glx_runtime_sweep.py",
                  "--gate", gate,
                  "--exe", str(client),
                  "--glx-module", str(glx_module),
                  "--basepath", basepath,
                  "--proof-dir", proof_dir,
                  "--proof-platform", os.environ["FNQL_GLX_PROOF_PLATFORM"],
                  "--proof-variant", variant,
                  "--proof-build-run-id", os.environ["FNQL_GLX_BUILD_RUN_ID"],
                  "--proof-build-run-attempt", os.environ["FNQL_GLX_BUILD_RUN_ATTEMPT"],
                  "--source-commit", os.environ["FNQL_GLX_SOURCE_COMMIT"],
                  "--output-dir", str(gate_output),
                  "--summary-markdown", str(summary_path),
                  "--screenshot-max-rms", os.environ["FNQL_GLX_SCREENSHOT_MAX_RMS"],
                  "--screenshot-max-pixel-ratio", os.environ["FNQL_GLX_SCREENSHOT_MAX_PIXEL_RATIO"],
                  "--performance-max-growth-ratio", os.environ["FNQL_GLX_PERFORMANCE_MAX_GROWTH_RATIO"],
              ]
              subprocess.check_call(command)
              github_summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if github_summary:
                  with open(github_summary, "a", encoding="utf-8") as handle:
                      handle.write(summary_path.read_text(encoding="utf-8"))

      - name: Upload same-artifact GLx proof
        uses: actions/upload-artifact@v7
        with:
          name: glx-release-proof-${{ matrix.proof_variant }}
          path: .tmp/glx-release-proof/${{ matrix.proof_variant }}/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30

  publish:
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        needs.prepare.result == 'success' &&
        needs.push-build-validation.result == 'success' &&
        needs.glx-release-proof.result == 'success'
      }}
    needs: [prepare, push-build-validation, glx-release-proof]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      models: read
      pull-requests: read
    env:
      HAS_COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
      HAS_DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Stamp release build version
        run: python scripts/manual_release.py stamp-version --build-number "${{ needs.prepare.outputs.build_number }}"

      - name: Download MinGW artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-mingw-x86
          path: artifacts/windows-mingw-x86

      - name: Download MSVC artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-msvc-x86
          path: artifacts/windows-msvc-x86

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-x86
          path: artifacts/linux-x86

      - name: Download MinGW GLx proof
        uses: actions/download-artifact@v8
        with:
          name: glx-release-proof-windows-mingw-x86
          path: .tmp/glx-release-proof/windows-mingw-x86

      - name: Download MSVC GLx proof
        uses: actions/download-artifact@v8
        with:
          name: glx-release-proof-windows-msvc-x86
          path: .tmp/glx-release-proof/windows-msvc-x86

      - name: Download Linux GLx proof
        uses: actions/download-artifact@v8
        with:
          name: glx-release-proof-linux-x86
          path: .tmp/glx-release-proof/linux-x86

      - name: Resolve release version metadata
        run: |
          python scripts/version.py github-env --channel manual --build-number "${{ needs.prepare.outputs.build_number }}" --build-date "${{ needs.prepare.outputs.build_date }}" --commit "${{ needs.prepare.outputs.head_commit }}" >> "$GITHUB_ENV"

      - name: Package release archives
        run: |
          python scripts/release.py --channel manual --artifact-root artifacts --build-number "${{ needs.prepare.outputs.build_number }}" --build-date "${{ needs.prepare.outputs.build_date }}" --commit "${{ needs.prepare.outputs.head_commit }}" --require-glx-proof --glx-proof-root .tmp/glx-release-proof --glx-proof-build-run-id "${{ github.run_id }}" --glx-proof-build-run-attempt "${{ github.run_attempt }}"

      - name: Build Copilot changelog cleanup
        id: copilot_notes
        if: ${{ env.HAS_COPILOT_TOKEN == 'true' && needs.prepare.outputs.previous_release_commit != '' }}
        uses: github/copilot-release-notes@v1.0.1
        with:
          base-ref: ${{ needs.prepare.outputs.previous_release_commit }}
          head-ref: ${{ needs.prepare.outputs.head_commit }}
          instructions: .github/release-notes-instructions.md
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Save Copilot highlights
        if: ${{ steps.copilot_notes.outputs.release-notes != '' }}
        env:
          COPILOT_RELEASE_NOTES: ${{ steps.copilot_notes.outputs.release-notes }}
        run: |
          mkdir -p .tmp
          printf '%s\n' "$COPILOT_RELEASE_NOTES" > .tmp/copilot-release-notes.md

      - name: Build release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FROM_ARGS=()
          if [ -n "${{ needs.prepare.outputs.previous_release_commit }}" ]; then
            FROM_ARGS+=(--from-commit "${{ needs.prepare.outputs.previous_release_commit }}")
          fi
          HIGHLIGHTS_ARGS=()
          if [ -s .tmp/copilot-release-notes.md ]; then
            HIGHLIGHTS_ARGS+=(--highlights-file .tmp/copilot-release-notes.md)
          fi
          python scripts/manual_release.py release-notes \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --build-date "${{ needs.prepare.outputs.build_date }}" \
            --to-commit "${{ needs.prepare.outputs.head_commit }}" \
            "${FROM_ARGS[@]}" \
            "${HIGHLIGHTS_ARGS[@]}" \
            --output .tmp/release-notes.md

      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${FNQL_RELEASE_TAG}" \
            .install/packages/*.zip \
            .install/packages/*.tar.gz \
            .install/release-manifest.json \
            .install/SHA256SUMS.txt \
            --target "${{ needs.prepare.outputs.head_commit }}" \
            --title "${FNQL_RELEASE_TITLE}" \
            --notes-file .tmp/release-notes.md

      - name: Clear pending changelog
        if: ${{ github.ref_type == 'branch' }}
        run: |
          python scripts/changelog.py clear-unreleased
          if git diff --quiet -- docs/fnql/CHANGELOG.md; then
            echo "Pending changelog already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fnql/CHANGELOG.md
          git commit -m "Reset pending changelog after release"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Announce release on Discord
        if: >-
          ${{
            always() &&

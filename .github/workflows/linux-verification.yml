name: Linux verification

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/linux-verification.yml'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'meson.build'
      - 'meson_options.txt'
      - 'misc/meson/**'
      - 'code/**'
      - 'pkg/**'
      - 'scripts/**'
      - 'subprojects/**'
      - 'tests/**'
      - 'version/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-server-i686:
    name: Make i686 dedicated server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install i686 compiler support
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y file gcc-multilib g++-multilib make python3

      - name: Build retail-width Linux dedicated server
        run: |
          make -j"$(nproc)" release \
            ARCH=x86 \
            COMPILE_ARCH=x86 \
            BUILD_CLIENT=0 \
            BUILD_SERVER=1 \
            USE_CURL=0 \
            USE_GLX=0 \
            USE_OGG_VORBIS=0 \
            USE_OPENGL_API=0 \
            USE_RENDERER_DLOPEN=0 \
            USE_RTX=0 \
            USE_SDL=0 \
            USE_VK=0 \
            USE_VULKAN_API=0
          test -x build/release-linux-x86/fnql.ded
          file build/release-linux-x86/fnql.ded | grep -F 'ELF 32-bit LSB'
          file build/release-linux-x86/fnql.ded | grep -F 'Intel 80386'

  meson-x86:
    name: Meson i686 server, renderers, and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Meson
        run: python -m pip install meson==1.9.1

      - name: Install i686 Meson build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -qq update
          sudo apt-get install -y \
            file \
            gcc-multilib \
            g++-multilib \
            glslang-tools \
            cmake \
            libdbus-1-dev:i386 \
            libegl-dev:i386 \
            libc6-dev-i386 \
            libgl-dev:i386 \
            libpipewire-0.3-dev:i386 \
            libudev-dev:i386 \
            libwayland-dev:i386 \
            libx11-dev:i386 \
            libxcursor-dev:i386 \
            libxext-dev:i386 \
            libxi-dev:i386 \
            libxkbcommon-dev:i386 \
            libxrandr-dev:i386 \
            libxxf86dga-dev:i386 \
            libxxf86vm-dev:i386 \
            linux-libc-dev:i386 \
            mesa-common-dev:i386 \
            ninja-build \
            pkg-config \
            python3 \
            wayland-protocols

      - name: Build dependency-isolated i686 dedicated server
        run: |
          meson setup .tmp/meson-linux-server-only \
            --cross-file misc/meson/linux-x86.ini \
            --buildtype=debugoptimized \
            --wrap-mode=nofallback \
            -Daudio-tests=false \
            -Dbuild-client=false \
            -Dbuild-server=true \
            -Dcurl=disabled \
            -Dglx-tests=false \
            -Dogg-vorbis=false \
            -Dsdl=disabled
          meson compile -C .tmp/meson-linux-server-only fnql.ded
          file .tmp/meson-linux-server-only/fnql.ded | grep -F 'ELF 32-bit LSB'
          file .tmp/meson-linux-server-only/fnql.ded | grep -F 'Intel 80386'

      - name: Build i686 renderer modules
        run: |
          meson setup .tmp/meson-linux-renderers \
            --cross-file misc/meson/linux-x86.ini \
            --buildtype=debugoptimized \
            -Daudio-tests=true \
            -Dbuild-client=true \
            -Dbuild-server=false \
            -Dcurl=disabled \
            -Dglx-tests=true \
            -Dogg-vorbis=false \
            -Drenderer-dlopen=true \
            -Drenderer-default=glx \
            -Drenderers=glx,vk,rtx \
            -Dsdl=disabled
          for renderer in glx vk rtx; do
            artifact=".tmp/meson-linux-renderers/fnql_${renderer}_x86.so"
            meson compile -C .tmp/meson-linux-renderers "fnql_${renderer}_x86"
            file "$artifact" | grep -F 'ELF 32-bit LSB'
            file "$artifact" | grep -F 'Intel 80386'
          done

      - name: Run complete i686 regression suite
        run: meson test -C .tmp/meson-linux-renderers --print-errorlogs

      - name: Build bundled SDL3 i686 client
        run: |
          meson setup .tmp/meson-linux-sdl \
            --cross-file misc/meson/linux-x86.ini \
            --buildtype=debugoptimized \
            --force-fallback-for=sdl3,fontstash \
            -Daudio-tests=false \
            -Dbuild-client=true \
            -Dbuild-server=false \
            -Dcurl=disabled \
            -Dglx-tests=false \
            -Dogg-vorbis=false \
            -Drenderer-dlopen=false \
            -Drenderer-default=glx \
            -Dsdl=enabled
          meson compile -C .tmp/meson-linux-sdl fnql
          file .tmp/meson-linux-sdl/fnql | grep -F 'ELF 32-bit LSB'
          file .tmp/meson-linux-sdl/fnql | grep -F 'Intel 80386'

      - name: Build CMake i686 dedicated server
        run: |
          cmake -S . -B .tmp/cmake-linux-server -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32 \
            -DCMAKE_SHARED_LINKER_FLAGS=-m32 \
            -DFNQL_AUDIO_LOOPBACK_TESTS=OFF \
            -DFNQL_GLX_LOGIC_TESTS=OFF \
            -DUSE_CURL=OFF \
            -DUSE_OGG_VORBIS=OFF \
            -DUSE_SDL=OFF \
            -DUSE_SYSTEM_JPEG=OFF
          cmake --build .tmp/cmake-linux-server --parallel 2 --target fnql.ded
          file .tmp/cmake-linux-server/fnql.ded | grep -F 'ELF 32-bit LSB'
          file .tmp/cmake-linux-server/fnql.ded | grep -F 'Intel 80386'
